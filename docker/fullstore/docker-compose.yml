# Local full-store CS-Cart sandbox for addon testing.
#
#   cp .env.example .env         # then fill CSCART_LICENSE_KEY
#   (drop cscart_v4.20.1.zip into ./kit/)
#   docker compose up -d --build
#
# Store       http://localhost:8080   (admin at /admin.php)
# Mailpit     http://localhost:8025   (catches every outbound email)
# phpMyAdmin  http://localhost:8081
#
# Reset clean:  docker compose down -v   (drops the docroot + db volumes)
name: novotonbun-fullstore

services:
  app:
    build:
      context: .
    image: novotonbun-fullstore-app:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      CSCART_DB_HOST: db
      CSCART_DB_NAME: "${CSCART_DB_NAME:-cscart}"
      CSCART_DB_USER: "${CSCART_DB_USER:-cscart}"
      CSCART_DB_PASSWORD: "${CSCART_DB_PASSWORD:-cscart}"
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # CS-Cart docroot lives in a named volume (fast on Windows; never
      # bind-mount the whole store). The repo is mounted read-only so addon
      # sources are live-editable from the host IDE. The kit folder feeds
      # the one-time install.
      - docroot:/var/www/html
      - ../..:/repo:ro
      - ./kit:/kit:ro
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "${CSCART_DB_NAME:-cscart}"
      MYSQL_USER: "${CSCART_DB_USER:-cscart}"
      MYSQL_PASSWORD: "${CSCART_DB_PASSWORD:-cscart}"
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: "${CSCART_DB_USER:-cscart}"
      PMA_PASSWORD: "${CSCART_DB_PASSWORD:-cscart}"
      UPLOAD_LIMIT: 256M
    ports:
      - "${PMA_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  docroot:
  dbdata:
