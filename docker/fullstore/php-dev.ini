; Dev sandbox PHP tuning — NOT a production profile.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 10000
date.timezone = Europe/Bucharest

; Opcache on, but validate timestamps every request so edits to addon .php
; files under /repo are picked up on the next page load without a rebuild.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Every mail() / PHPMailer-sendmail send goes to Mailpit via msmtp.
sendmail_path = /usr/bin/msmtp -t -i
